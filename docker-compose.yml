services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rumbo
    volumes:
      - rumbo_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d rumbo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://usuario:password@db:5432/rumbo
    volumes:
      - rumbo_cv_uploads:/app/uploads
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  rumbo_pgdata:
  rumbo_cv_uploads:
